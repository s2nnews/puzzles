name: dashboard-data

# Two-hourly refresh of dashboard/data.json and campaigns.json.
#
# Cadence reasoning: Shopify, Omnisend and ShipStation are read live, so the
# sales side genuinely moves between runs. The ad and funnel columns come
# from Porter's Google Sheet, which only refreshes every 3 hours (:00 and
# :10), so running much more often than that just re-reads the same numbers
# and adds commit noise. :25 lands shortly after each Porter write.
#
# Actions minutes are free and unlimited on public repos, so the cost is
# commit noise rather than money. GitHub runs schedules best-effort and
# delays them under load, so treat these times as approximate.
on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build dashboard/data.json
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          OMNISEND_API_KEY: ${{ secrets.OMNISEND_API_KEY }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY }}
          SHIPSTATION_API_SECRET: ${{ secrets.SHIPSTATION_API_SECRET }}
          # Published-CSV URL of the Porter export sheet. Falls back to the
          # committed dashboard/porter_feed.csv when unset.
          PORTER_CSV: ${{ secrets.PORTER_CSV }}
          CAMPAIGNS_CSV: ${{ secrets.CAMPAIGNS_CSV }}
          CHANNELS_CSV: ${{ secrets.CHANNELS_CSV }}
          # Google Search Console daily rows. UNSET until the GSC connector is
          # authorised in Porter and its export is published, and until then
          # the collector falls back to the committed search-console.csv, which
          # does NOT advance on its own. The organic chart says on its face how
          # many days behind it is, so this degrades loudly rather than
          # silently going stale.
          SEARCH_CONSOLE_CSV: ${{ secrets.SEARCH_CONSOLE_CSV }}
          DAYS: ${{ vars.DASHBOARD_DAYS }}
          OMNISEND_DAYS: ${{ vars.OMNISEND_DAYS }}
          # Optional. The "subscribed on email" segment used for the list-size
          # tile. Set it to 6a4a0a773d2497c30fdbbf11 to skip the discovery
          # lookup and spend one Omnisend request per run instead of two
          # (the API allows 55/day; this workflow runs 12 times).
          OMNISEND_SEGMENT_ID: ${{ vars.OMNISEND_SEGMENT_ID }}
        run: python dashboard/collect.py

      # This repo is PUBLIC. The feeds hold daily Shopify trading, so what gets
      # committed is one encrypted blob, never the plaintext. See
      # dashboard/encrypt.py for why a login on the page would not have worked.
      - name: Encrypt the feeds
        env:
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
        run: python dashboard/encrypt.py

      - name: Commit the feeds if they changed
        run: |
          # ONE file, and it is the encrypted bundle of all eight feeds. The
          # plaintext collect.py writes is gitignored and stays on the runner.
          # Adding any of it here would republish the sales figures in the clear
          # and undo the encryption entirely, so do not "helpfully" put them back.
          #
          # encrypt.py exits non-zero on a malformed feed or an unset passphrase,
          # so a bad build fails before this line rather than after it.
          git add dashboard/feeds.enc
          if git diff --cached --quiet; then
            echo "No change in the dashboard feeds"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: dashboard refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
          # The laptop's run_daily.py can push between our checkout and here.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing on origin/main"
            git pull --rebase --strategy-option=ours origin main || {
              git rebase --abort || true
              exit 1
            }
          done
          echo "could not push after 3 attempts" >&2
          exit 1
