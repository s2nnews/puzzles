name: dashboard-data

# Two-hourly refresh of dashboard/data.json and campaigns.json.
#
# Cadence reasoning: Shopify, Omnisend and ShipStation are read live, so the
# sales side genuinely moves between runs. The ad and funnel columns come
# from Porter's Google Sheet, which only refreshes every 3 hours (:00 and
# :10), so running much more often than that just re-reads the same numbers
# and adds commit noise. :25 lands shortly after each Porter write.
#
# Actions minutes are free and unlimited on public repos, so the cost is
# commit noise rather than money. GitHub runs schedules best-effort and
# delays them under load, so treat these times as approximate.
on:
  schedule:
    - cron: "25 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two refreshes race each other onto the same branch.
concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build dashboard/data.json
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          OMNISEND_API_KEY: ${{ secrets.OMNISEND_API_KEY }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY }}
          SHIPSTATION_API_SECRET: ${{ secrets.SHIPSTATION_API_SECRET }}
          # Published-CSV URL of the Porter export sheet. Falls back to the
          # committed dashboard/porter_feed.csv when unset.
          PORTER_CSV: ${{ secrets.PORTER_CSV }}
          CAMPAIGNS_CSV: ${{ secrets.CAMPAIGNS_CSV }}
          CHANNELS_CSV: ${{ secrets.CHANNELS_CSV }}
          DAYS: ${{ vars.DASHBOARD_DAYS }}
          OMNISEND_DAYS: ${{ vars.OMNISEND_DAYS }}
        run: python dashboard/collect.py

      - name: Commit the feeds if they changed
        run: |
          git add dashboard/data.json dashboard/campaigns.json dashboard/channels.json
          if git diff --cached --quiet; then
            echo "No change in data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: dashboard refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
          # The laptop's run_daily.py can push between our checkout and here.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing on origin/main"
            git pull --rebase --strategy-option=ours origin main || {
              git rebase --abort || true
              exit 1
            }
          done
          echo "could not push after 3 attempts" >&2
          exit 1
