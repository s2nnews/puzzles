name: dashboard-data

on:
  schedule:
    - cron: "0 20 * * *"   # nightly ~06:00 Sydney
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build dashboard/data.json
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          OMNISEND_API_KEY: ${{ secrets.OMNISEND_API_KEY }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY }}
          SHIPSTATION_API_SECRET: ${{ secrets.SHIPSTATION_API_SECRET }}
          META_CSV: ${{ secrets.META_CSV }}
          DAYS: ${{ vars.DASHBOARD_DAYS }}
        run: python dashboard/collect.py

      - name: Commit data.json if changed
        run: |
          git add dashboard/data.json
          if git diff --cached --quiet; then
            echo "No change in data.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "dashboard: nightly data refresh"
            git push
          fi
